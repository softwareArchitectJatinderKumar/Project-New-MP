<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-3">
  <span class="text-muted small">
    Showing {{ rangeStart }} to {{ rangeEnd }} of {{ totalItems }} entries
  </span>

  <div class="d-flex align-items-center gap-2">
    <label for="recordsPerPageSelect" class="text-muted small mb-0">Rows per page</label>
    <select
      id="recordsPerPageSelect"
      class="form-select form-select-sm w-auto"
      [ngModel]="pageSize"
      (ngModelChange)="onPageSizeChange($event)"
    >
      <option *ngFor="let option of pageSizeOptions" [value]="option">{{ option }}</option>
    </select>

    <button
      type="button"
      class="btn btn-outline-secondary btn-sm"
      (click)="goToPrevious()"
      [disabled]="currentPage === 1"
    >
      <i class="bi bi-chevron-left"></i>
    </button>
    <span class="small text-muted">{{ currentPage }} / {{ totalPages }}</span>
    <button
      type="button"
      class="btn btn-outline-secondary btn-sm"
      (click)="goToNext()"
      [disabled]="currentPage === totalPages"
    >
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>
