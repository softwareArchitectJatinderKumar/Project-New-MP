<div class="example" *ngIf="LoginStatus; else ErrorApplication">
  <nav class="navbar navbar-expand-lg navbar-light bg-info">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle text-dark fw-bold fs-5" href="#" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">
              Applications
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item text-dark fw-bold fs-5" (click)="gotoWithToken('ViewAllApplications',this.loginName)">All Applications</a></li>
              <!-- <li><a class="dropdown-item text-dark fw-bold fs-5" (click)="goto('SMAllPending')">List Pending</a></li>
              <li><a class="dropdown-item text-dark fw-bold fs-5" (click)="goto('SMAllApproved')">List Approved</a></li> -->
            </ul>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle text-dark fw-bold fs-5" href="#" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">
              University
            </a>
            <ul class="dropdown-menu">
              <!-- <li><a class="dropdown-item text-dark fw-bold fs-5" (click)="goto('SMAddSingleUniverstrity')">Single Entry</a></li> -->
              <li><a class="dropdown-item text-dark fw-bold fs-5" (click)="goto('AllUniversities')">View All</a></li>
            </ul>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle text-dark fw-bold fs-5" href="#" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">
              CheckList
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item text-dark fw-bold fs-5" (click)="goto('StageAllCheckList')">Search Documents</a></li>
              <li><a class="dropdown-item text-dark fw-bold fs-5" (click)="goto('AllPendingDocs')">Search Pending</a></li>
            </ul>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle text-dark fw-bold fs-5" href="#" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">
              Course Mapping
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item text-dark fw-bold fs-5" (click)="goto('CourseMapping')">Mapping Upload Doc</a></li>
            </ul>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle text-dark fw-bold fs-5" href="#" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">
              Interview Schedules
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item text-dark fw-bold fs-5" (click)="goto('ScheduleInterview')">Upload Schedule Interview</a></li>
              <li><a class="dropdown-item text-dark fw-bold fs-5" (click)="goto('ShowReport')">Show Report</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>

<ng-template #ErrorApplication>
  <div class="row card h-100">
    <div class="col-12">
      <h3 class="text-center fs-2 m-5 text-danger pt-5">Error in User Login.</h3>
      <div class="row mt-4 mb-4">
        <div class="col-sm-12 text-center">
          <div class="mb-3 p-4">
            <label class="form-label fs-4 text-danger">Something Went Wrong. Please Try login again!.</label>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
