<div class="phone-input-wrapper">
  <div class="input-group">
    <select
      class="form-select dial-select"
      [(ngModel)]="selectedDial"
      [ngModelOptions]="{ standalone: true }"
      [disabled]="isDisabled"
      (change)="onDialChange()"
      aria-label="Select country code">
      <option *ngFor="let d of dialCodes" [value]="d.dial">
        {{ d.name }} ({{ d.dial }})
      </option>
    </select>
    <input
      type="tel"
      class="form-control phone-number-field"
      [placeholder]="placeholder"
      [value]="numberPart"
      [disabled]="isDisabled"
      (input)="onNumberInput($event)"
      (blur)="onBlur()"
     [attr.maxlength]="maxSubscriberLength" 
      inputmode="numeric"
      autocomplete="tel-national" />
  </div>
  <div class="phone-input-hint">
    <i class="bi bi-info-circle"></i>
    Subscriber number only &mdash; {{ lengthHint }} for {{ selectedDial }}
  </div>
</div>
