</div>

<div class="container-fluid mt-4" id="UserDashboardId"
     *ngIf="!isLoginFailed; else ErrorApplication">

    <div class="row mb-4">
        <div class="col-md-4 grid-margin stretch-card">
            <div class="card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <label class="form-label text-danger fw-bold mb-0">Employee Name / UID:</label>
                    <label class="form-label text-dark fw-bold text-end mb-0">
                        {{ EmployeeName }} / {{ EmployeeCode }}
                    </label>
                </div>
            </div>
        </div>
        <div class="col-md-4 grid-margin stretch-card">
            <div class="card">
                <div class="card-body d-flex justify-content-center align-items-center">
                    <label class="form-label text-center text-danger fw-bold mb-0">{{ pageTitle }}</label>
                </div>
            </div>
        </div>
        <div class="col-md-4 grid-margin stretch-card">
            <div class="card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <label class="form-label text-danger fw-bold mb-0">Department Name:</label>
                    <label class="form-label text-dark fw-bold text-end mb-0">{{ DepartmentName }}</label>
                </div>
            </div>
        </div>
    </div>
 
    <ng-container *ngIf="isDealingAuthority">
        <h5 class="text-danger fw-bold mb-3">
            <i class="bi bi-person-badge me-2"></i>Counsellor Dashboard
            <span class="badge bg-secondary ms-2">{{ (visibleApplications | roleFilter:'_isCounsellor').length }} students</span>
        </h5>
        <ngx-datatable
            class="bootstrap table table-striped material"
            [rows]="visibleApplications | roleFilter:'_isCounsellor'"
            [loadingIndicator]="loadingIndicator"
            [columnMode]="ColumnMode.force"
            [footerHeight]="50"
            [limit]="10"
            [headerHeight]="80"
            [rowHeight]="'auto'"
            [scrollbarH]="true">

            <ngx-datatable-column name="App. ID"        prop="applicationId"  [width]="80"></ngx-datatable-column>
             <ngx-datatable-column name="Student Name"   prop="studentName"  [width]="80"></ngx-datatable-column>
            <ngx-datatable-column name="Reg. No"        prop="registrationNo" [width]="110"></ngx-datatable-column>
            <ngx-datatable-column name="Contact No"     prop="phoneNumber"    [width]="110"></ngx-datatable-column>
            <ngx-datatable-column name="Parent Contact" prop="parentContact"  [width]="115"></ngx-datatable-column>

            <ngx-datatable-column name="Counselling Status" [width]="130">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <span class="badge" [ngClass]="isTrue(row.counsellingStatus) ? 'bg-success' : 'bg-warning text-dark'">
                        {{ counsellingLabel(row.counsellingStatus) }}
                    </span>
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column name="Application Status" [width]="130">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <span class="badge" [ngClass]="approvalClass(row.isApproved)">
                        {{ approvalLabel(row.isApproved) }}
                    </span>
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column name="Actions" [sortable]="false" [width]="380">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <button class="btn btn-warning btn-sm me-1 mb-1" (click)="ForwardToFaculty(row)">
                        <i class="bi bi-send me-1"></i>Forward to Faculty
                    </button>
                    <button class="btn btn-primary btn-sm me-1 mb-1" (click)="submitCounsellingRemarks(row)">
                        <i class="bi bi-chat-left-text me-1"></i>
                        {{ isTrue(row.counsellingStatus) ? 'Update Remarks' : 'Add Remarks' }}
                    </button>
                    <button class="btn btn-info btn-sm me-1 mb-1"
                        (click)="viewAllRemarks(row, 'counsellor')"
                        [disabled]="!hasAnyRemarks(row)">
                        <i class="bi bi-eye me-1"></i>View Remarks
                    </button>
                    <button class="btn btn-danger btn-sm me-1 mb-1"
                        (click)="disapproveApplication(row)"
                        [disabled]="approvalLabel(row.isApproved) === 'Rejected'">
                        <i class="bi bi-x-circle me-1"></i>Reject
                    </button>
                </ng-template>
            </ngx-datatable-column>
        </ngx-datatable>
    </ng-container>


  
    <ng-container *ngIf="isdealingFaculty">
        <h5 class="text-primary fw-bold mb-3">
            <i class="bi bi-person-workspace me-2"></i>Faculty Dashboard
            <span class="badge bg-secondary ms-2">{{ (visibleApplications | roleFilter:'_isFaculty').length }} students</span>
        </h5>
        <ngx-datatable
            class="bootstrap table table-striped material"
            [rows]="visibleApplications | roleFilter:'_isFaculty'"
            [loadingIndicator]="loadingIndicator"
            [columnMode]="ColumnMode.force"
            [footerHeight]="50"
            [limit]="10"
            [headerHeight]="80"
            [rowHeight]="'auto'"
            [scrollbarH]="true">

            <ngx-datatable-column name="App. ID"        prop="applicationId"  [width]="80"></ngx-datatable-column>
             <ngx-datatable-column name="Student Name"   prop="studentName"  [width]="80"></ngx-datatable-column>
            <ngx-datatable-column name="Reg. No"        prop="registrationNo" [width]="110"></ngx-datatable-column>
            <ngx-datatable-column name="Contact No"     prop="phoneNumber"    [width]="110"></ngx-datatable-column>
            <ngx-datatable-column name="Parent Contact" prop="parentContact"  [width]="115"></ngx-datatable-column>

            <ngx-datatable-column name="Counselling Status" [width]="130">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <span class="badge" [ngClass]="isTrue(row.counsellingStatus) ? 'bg-success' : 'bg-warning text-dark'">
                        {{ counsellingLabel(row.counsellingStatus) }}
                    </span>
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column name="Application Status" [width]="130">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <span class="badge" [ngClass]="approvalClass(row.isApproved)">
                        {{ approvalLabel(row.isApproved) }}
                    </span>
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column name="Fwd. to HOD" [width]="110">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <span class="badge" [ngClass]="isTrue(row.isForwardtoHOD) ? 'bg-success' : 'bg-secondary'">
                        {{ isTrue(row.isForwardtoHOD) ? 'Yes' : 'No' }}
                    </span>
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column name="Actions" [sortable]="false" [width]="500">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <button class="btn btn-primary btn-sm me-1 mb-1" (click)="openAddRemarksModal(row)">
                        <i class="bi bi-pencil-square me-1"></i>Add Remarks
                    </button>
                    <button class="btn btn-secondary btn-sm me-1 mb-1"
                        (click)="UploadEvaluationRemarks(row, 'Faculty')">
                        <i class="bi bi-clipboard-check me-1"></i>Submit Evaluation
                    </button>
                    <button class="btn btn-warning btn-sm me-1 mb-1"
                        (click)="ForwardToHod(row, 'Hod')"
                        [disabled]="isTrue(row.isForwardtoHOD)">
                        <i class="bi bi-send me-1"></i>
                        {{ isTrue(row.isForwardtoHOD) ? 'Forwarded ✓' : 'Forward to HOD' }}
                    </button>
                    <button class="btn btn-info btn-sm me-1 mb-1"
                        (click)="viewAllRemarks(row, 'faculty')"
                        [disabled]="!hasAnyRemarks(row)">
                        <i class="bi bi-eye me-1"></i>View Remarks
                    </button>
                </ng-template>
            </ngx-datatable-column>
        </ngx-datatable>
    </ng-container>


 
    <ng-container *ngIf="isHOD">
        <h5 class="text-success fw-bold mb-3">
            <i class="bi bi-building me-2"></i>Head of Department Dashboard
        </h5>

        <ul class="nav nav-tabs mb-3">
            <li class="nav-item">
                <button class="nav-link" [class.active]="hodActiveTab === 'my'"
                    (click)="switchHodTab('my')">
                    <i class="bi bi-person-lines-fill me-1"></i>
                    (I) My Applications
                    <span class="badge bg-success ms-1">{{ hodMyApplications.length }}</span>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" [class.active]="hodActiveTab === 'all'"
                    (click)="switchHodTab('all')">
                    <i class="bi bi-table me-1"></i>
                    (II) All Applications
                    <span class="badge bg-secondary ms-1">{{ hodAllApplications.length }}</span>
                </button>
            </li>
        </ul>

        <div *ngIf="hodActiveTab === 'my'">
            <p class="text-muted small mb-2">
                Showing applications where a Faculty has been assigned
                (DealingFaculty is non-null).
            </p>
            <ngx-datatable
                class="bootstrap table table-striped material"
                [rows]="hodMyApplications"
                [loadingIndicator]="loadingIndicator"
                [columnMode]="ColumnMode.force"
                [footerHeight]="50"
                [limit]="10"
                [headerHeight]="80"
                [rowHeight]="'auto'"
                [scrollbarH]="true">

                <ngx-datatable-column name="App. ID"        prop="applicationId"  [width]="80"></ngx-datatable-column>
                <ngx-datatable-column name="Student Name"   prop="studentName"  [width]="80"></ngx-datatable-column>
                <ngx-datatable-column name="Reg. No"        prop="registrationNo" [width]="110"></ngx-datatable-column>
                <ngx-datatable-column name="Contact No"     prop="phoneNumber"    [width]="110"></ngx-datatable-column>
                <ngx-datatable-column name="Parent Contact" prop="parentContact"  [width]="115"></ngx-datatable-column>

                <ngx-datatable-column name="Counselling Status" [width]="130">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <span class="badge" [ngClass]="isTrue(row.counsellingStatus) ? 'bg-success' : 'bg-warning text-dark'">
                            {{ counsellingLabel(row.counsellingStatus) }}
                        </span>
                    </ng-template>
                </ngx-datatable-column>

                <ngx-datatable-column name="Application Status" [width]="130">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <span class="badge" [ngClass]="approvalClass(row.isApproved)">
                            {{ approvalLabel(row.isApproved) }}
                        </span>
                    </ng-template>
                </ngx-datatable-column>

                <ngx-datatable-column name="Fwd. to HoW" [width]="110">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <span class="badge" [ngClass]="isTrue(row.isForwardedtoHOW) ? 'bg-success' : 'bg-secondary'">
                            {{ isTrue(row.isForwardedtoHOW) ? 'Yes' : 'No' }}
                        </span>
                    </ng-template>
                </ngx-datatable-column>

                <ngx-datatable-column name="Actions" [sortable]="false" [width]="560">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <button class="btn btn-info btn-sm me-1 mb-1"
                            (click)="viewAllRemarks(row, 'hod')"
                            [disabled]="!hasAnyRemarks(row)">
                            <i class="bi bi-eye me-1"></i>View Remarks
                        </button>
                        <button class="btn btn-primary btn-sm me-1 mb-1"
                            (click)="UploadEvaluationRemarks(row, 'HOD')">
                            <i class="bi bi-clipboard-check me-1"></i>Submit Evaluation
                        </button>
                        <button class="btn btn-success btn-sm me-1 mb-1"
                            (click)="acceptApplication(row)"
                            [disabled]="approvalLabel(row.isApproved) !== 'Pending'">
                            <i class="bi bi-check-circle me-1"></i>Accept
                        </button>
                        <button class="btn btn-danger btn-sm me-1 mb-1"
                            (click)="disapproveApplication(row)"
                            [disabled]="approvalLabel(row.isApproved) === 'Rejected'">
                            <i class="bi bi-x-circle me-1"></i>Reject
                        </button>
                        <button class="btn btn-warning btn-sm me-1 mb-1"
                            (click)="ForwardToHod(row, 'How')"
                            [disabled]="isTrue(row.isForwardedtoHOW)">
                            <i class="bi bi-send me-1"></i>
                            {{ isTrue(row.isForwardedtoHOW) ? 'Fwd. to HoW ✓' : 'Forward to HoW' }}
                        </button>
                    </ng-template>
                </ngx-datatable-column>
            </ngx-datatable>
        </div>

        <div *ngIf="hodActiveTab === 'all'">
            <p class="text-muted small mb-2">
                Full application list from
                <code>GetSemesterExchangeApplicationForHOD()</code>.
                Assign counsellors and monitor forwarding status here.
            </p>
            <ngx-datatable
                class="bootstrap table table-striped material"
                [rows]="hodAllApplications"
                [loadingIndicator]="loadingIndicator"
                [columnMode]="ColumnMode.force"
                [footerHeight]="50"
                [limit]="10"
                [headerHeight]="80"
                [rowHeight]="'auto'"
                [scrollbarH]="true">

                <ngx-datatable-column name="App. ID"        prop="applicationId"  [width]="80"></ngx-datatable-column>
                 <ngx-datatable-column name="Student Name"   prop="studentName"  [width]="80"></ngx-datatable-column>
                <ngx-datatable-column name="Reg. No"        prop="registrationNo" [width]="110"></ngx-datatable-column>
                <ngx-datatable-column name="Contact No"     prop="phoneNumber"    [width]="110"></ngx-datatable-column>
                <ngx-datatable-column name="Parent Contact" prop="parentContact"  [width]="115"></ngx-datatable-column>

                <ngx-datatable-column name="Counselling Status" [width]="130">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <span class="badge" [ngClass]="isTrue(row.counsellingStatus) ? 'bg-success' : 'bg-warning text-dark'">
                            {{ counsellingLabel(row.counsellingStatus) }}
                        </span>
                    </ng-template>
                </ngx-datatable-column>

                <ngx-datatable-column name="Application Status" [width]="130">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <span class="badge" [ngClass]="approvalClass(row.isApproved)">
                            {{ approvalLabel(row.isApproved) }}
                        </span>
                    </ng-template>
                </ngx-datatable-column>

                <ngx-datatable-column name="Counsellor" [width]="160">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <ng-container *ngIf="row.dealingAuthority; else noCounsellor">
                            <span class="badge bg-success">{{ row.dealingAuthority }}</span>
                        </ng-container>
                        <ng-template #noCounsellor>
                            <button class="btn btn-outline-warning btn-sm" (click)="assignCounsellor(row)">
                                <i class="bi bi-person-plus me-1"></i>Assign
                            </button>
                        </ng-template>
                    </ng-template>
                </ngx-datatable-column>

                <ngx-datatable-column name="Forwarded" [width]="160">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <span class="badge me-1"
                            [ngClass]="isTrue(row.isForwardtoHOD) ? 'bg-success' : 'bg-secondary'">
                            HOD: {{ isTrue(row.isForwardtoHOD) ? 'Yes' : 'No' }}
                        </span>
                        <span class="badge"
                            [ngClass]="isTrue(row.isForwardedtoHOW) ? 'bg-success' : 'bg-secondary'">
                            HoW: {{ isTrue(row.isForwardedtoHOW) ? 'Yes' : 'No' }}
                        </span>
                    </ng-template>
                </ngx-datatable-column>

                <ngx-datatable-column name="Counselling Remarks" prop="counsellingRemarks" [width]="200">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <span [title]="row.counsellingRemarks || ''">
                            {{ (row.counsellingRemarks || '—') | slice:0:40 }}
                            <span *ngIf="row.counsellingRemarks?.length > 40">…</span>
                        </span>
                    </ng-template>
                </ngx-datatable-column>

                <ngx-datatable-column name="Actions" [sortable]="false" [width]="240">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <button class="btn btn-info btn-sm me-1 mb-1" (click)="GetStudentApplication(row)">
                            <i class="bi bi-eye me-1"></i>View Details
                        </button>
                        <button class="btn btn-secondary btn-sm me-1 mb-1"
                            (click)="viewAllRemarks(row, 'hod')"
                            [disabled]="!hasAnyRemarks(row)">
                            <i class="bi bi-chat-square-text me-1"></i>View Remarks
                        </button>
                    </ng-template>
                </ngx-datatable-column>
            </ngx-datatable>
        </div>
    </ng-container>

<ng-template #ErrorApplication>
    <div class="text-center" *ngIf="isLoginFailed">
        <h3 class="text-center fs-2 m-5 text-danger pt-5">Error in User Login.</h3>
        <div class="row mt-4 mb-4">
            <div class="col-sm-12 text-center">
                <div class="mb-3 p-4">
                    <label class="form-label fs-4 text-danger">Unauthorized Access.</label>
                </div>
            </div>
        </div>
    </div>
</ng-template>


 
<ng-template #ViewRemarksModal let-modal>
    <div class="modal-header bg-light">
        <h5 class="modal-title">
            <i class="bi bi-chat-square-text-fill text-info me-2"></i>
            All Remarks — Reg. No: {{ selectedRemarks?.registrationNo }}
            &nbsp;|&nbsp; App. ID: {{ selectedRemarks?.applicationId }}
        </h5>
        <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body" *ngIf="selectedRemarks">

        <div class="row g-3">

            <div class="col-md-6">
                <div class="card h-100 border-primary">
                    <div class="card-header bg-primary text-white py-2">
                        <i class="bi bi-person-badge me-2"></i>Counselling Remarks
                        <span class="badge ms-2"
                            [ngClass]="selectedRemarks.counsellingDone ? 'bg-light text-primary' : 'bg-warning text-dark'">
                            {{ selectedRemarks.counsellingDone ? 'Counselled' : 'Pending' }}
                        </span>
                    </div>
                    <div class="card-body">
                        <p class="mb-1">{{ selectedRemarks.counsellingRemarks || 'No counselling remarks available.' }}</p>
                        <small class="text-muted" *ngIf="selectedRemarks.counsellingDate">
                            <i class="bi bi-calendar me-1"></i>Date: {{ selectedRemarks.counsellingDate | date:'dd MMM yyyy, hh:mm a' }}
                        </small>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card h-100 border-info">
                    <div class="card-header bg-info text-white py-2">
                        <i class="bi bi-person-workspace me-2"></i>Faculty / Interview Remarks
                    </div>
                    <div class="card-body p-2">
                        <ng-container *ngIf="selectedRemarks.facultyRemarks; else noFacultyRemarks">
                            <div *ngFor="let entry of selectedRemarks.facultyRemarks.split('\n---\n'); let i = index"
                                 class="small" [class.border-top]="i > 0" [class.pt-2]="i > 0" [class.mt-2]="i > 0">
                                <span style="white-space: pre-wrap">{{ entry }}</span>
                            </div>
                        </ng-container>
                        <ng-template #noFacultyRemarks>
                            <p class="mb-0 text-muted">No faculty remarks available.</p>
                        </ng-template>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card h-100 border-success">
                    <div class="card-header bg-success text-white py-2">
                        <i class="bi bi-building me-2"></i>HOD Remarks
                        <span class="badge ms-2"
                            [ngClass]="selectedRemarks.forwardedToHOD ? 'bg-light text-success' : 'bg-secondary'">
                            {{ selectedRemarks.forwardedToHOD ? 'Forwarded to HOD' : 'Not forwarded' }}
                        </span>
                    </div>
                    <div class="card-body">
                        <p class="mb-0">{{ selectedRemarks.hodRemarks || 'No HOD remarks available.' }}</p>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card h-100 border-warning">
                    <div class="card-header bg-warning text-dark py-2">
                        <i class="bi bi-diagram-3 me-2"></i>Head of Wing Remarks
                        <span class="badge ms-2"
                            [ngClass]="selectedRemarks.forwardedToHoW ? 'bg-light text-dark' : 'bg-secondary text-white'">
                            {{ selectedRemarks.forwardedToHoW ? 'Forwarded to HoW' : 'Not forwarded' }}
                        </span>
                    </div>
                    <div class="card-body">
                        <p class="mb-0">{{ selectedRemarks.howRemarks || 'No HoW remarks available.' }}</p>
                    </div>
                </div>
            </div>

  
            <div class="col-md-12" *ngIf="selectedRemarks.approvalRemarks">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white py-2">
                        <i class="bi bi-shield-exclamation me-2"></i>Approval / Rejection Remarks
                    </div>
                    <div class="card-body">
                        <p class="mb-0">{{ selectedRemarks.approvalRemarks }}</p>
                    </div>
                </div>
            </div>

 
            <div class="col-md-12" *ngIf="selectedRemarksCallerRole !== 'counsellor'">
                <div class="card border-secondary">
                    <div class="card-header bg-secondary text-white py-2 d-flex align-items-center">
                        <i class="bi bi-clipboard-data me-2"></i>
                        <span>Evaluation Marks</span>
                        <span class="ms-2 text-white-50 small" *ngIf="selectedRemarks.evaluationBy">
                            &nbsp;|&nbsp; Submitted by: {{ selectedRemarks.evaluationBy }}
                        </span>
                        <span class="badge ms-auto"
                            [ngClass]="selectedRemarks.totalMarks ? 'bg-success' : 'bg-light text-secondary border'">
                            {{ selectedRemarks.totalMarks ? 'Total: ' + selectedRemarks.totalMarks : 'Pending' }}
                        </span>
                    </div>
                    <div class="card-body">
                        <ng-container *ngIf="selectedRemarks.academicsMarks; else noEvalData">
                            <div class="row text-center g-2 mb-2">
                                <div class="col">
                                    <div class="border rounded p-2">
                                        <div class="fw-bold text-muted small">Academics</div>
                                        <div class="fs-5 fw-bold">{{ selectedRemarks.academicsMarks }}</div>
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="border rounded p-2">
                                        <div class="fw-bold text-muted small">Communication</div>
                                        <div class="fs-5 fw-bold">{{ selectedRemarks.communicationSkillsMarks || '—' }}</div>
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="border rounded p-2">
                                        <div class="fw-bold text-muted small">Attitude</div>
                                        <div class="fs-5 fw-bold">{{ selectedRemarks.attitudeMarks || '—' }}</div>
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="border rounded p-2">
                                        <div class="fw-bold text-muted small">Extra-Curricular</div>
                                        <div class="fs-5 fw-bold">{{ selectedRemarks.extraCurricularMarks || '—' }}</div>
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="border rounded p-2">
                                        <div class="fw-bold text-muted small">Knowledge</div>
                                        <div class="fs-5 fw-bold">{{ selectedRemarks.knowledgeMarks || '—' }}</div>
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="border rounded p-2 bg-success bg-opacity-10">
                                        <div class="fw-bold text-success small">Total</div>
                                        <div class="fs-4 fw-bold text-success">{{ selectedRemarks.totalMarks || '—' }}</div>
                                    </div>
                                </div>
                            </div>
                            <div *ngIf="selectedRemarks.evaluationComments" class="mt-1">
                                <span class="fw-semibold">Comments:</span>
                                <span class="text-muted ms-1">{{ selectedRemarks.evaluationComments }}</span>
                            </div>
                        </ng-container>
                        <ng-template #noEvalData>
                            <p class="text-muted mb-0">
                                <i class="bi bi-hourglass me-1"></i>
                                Evaluation marks not yet submitted for this application.
                            </p>
                        </ng-template>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">
            <i class="bi bi-x-circle me-1"></i>Close
        </button>
    </div>
</ng-template>

 
<ng-template #EvaluationModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title">
            <i class="bi bi-clipboard-check me-2"></i>Submit Evaluation Remarks
        </h5>
        <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body">
        <form [formGroup]="EvaluationForm" (ngSubmit)="submitEvaluationForm()" novalidate>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Application ID:</label>
                    <input type="text" class="form-control" [value]="ApplicationId" disabled />
                </div>
                <div class="col-md-6">
                    <label class="form-label">Registration Number:</label>
                    <input type="text" class="form-control" [value]="RegistrationNo" disabled />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4" *ngFor="let field of [
                    {label: 'Academics Marks',             name: 'AcademicsMarks'},
                    {label: 'Communication Skills Marks',  name: 'CommunicationSkillsMarks'},
                    {label: 'Attitude Marks',              name: 'AttitudeMarks'},
                    {label: 'Extra-Curricular Activities', name: 'ExtraCurricularMarks'},
                    {label: 'Knowledge Marks',             name: 'KnowledgeMarks'}
                ]">
                    <label class="form-label">{{ field.label }}: <span class="text-danger">*</span></label>
                    <input type="number" class="form-control"
                        [formControlName]="field.name" min="0" max="100" />
                    <div class="text-danger small"
                        *ngIf="evaluationFormControls[field.name]?.invalid &&
                               (evaluationFormControls[field.name]?.touched || isEvaluationFormSubmitted)">
                        Required, 0–100.
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Comments:</label>
                <textarea class="form-control" rows="3" formControlName="Comments"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-save me-1"></i>Submit Evaluation
                </button>
            </div>
        </form>
    </div>
</ng-template>
