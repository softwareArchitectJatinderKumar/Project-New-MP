 <!-- Top-level nav tabs -->
  <div class="col-md-12 grid-margin stretch-card mb-3">
    <div class="card step-indicator-card">
      <div class="card-body py-3 px-4">
        <div class="nav nav-tabs d-flex justify-content-center flex-wrap gap-2 border-0">
          <button type="button" class="btn" [class.active]="activeTab === 'stage1'" [disabled]="isSwitching"
            (click)="setTab('stage1')">Stage I </button>
          <button type="button" class="btn" [class.active]="activeTab === 'stage2'" [disabled]="isSwitching"
            (click)="setTab('stage2')">Stage II Documents</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Transition loader: shown while moving between wizard steps or nav tabs -->
  <div *ngIf="isSwitching" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2 text-muted small">Loading...</p>
  </div>

 <div *ngIf="activeTab === 'stage1'">
      <stage-1-Documents [stuApplication]="stuApplication" [stagesDetail]="stagesDetail"
        [documentApprovals]="documentApprovals" [localServerUrl]="localServerUrl" [isParentLoading]="isParentLoading"
        (fileSelected)="fileSelected.emit($event)">
      </stage-1-Documents>
    </div>
     <div *ngIf="activeTab === 'stage2'">
      <app-step-stage2 [stuApplication]="stuApplication" [stagesDetail]="stagesDetail"
         [documentApprovals]="documentApprovals" [localServerUrl]="localServerUrl" [isParentLoading]="isParentLoading"
        (fileSelected)="fileSelected.emit($event)">
      </app-step-stage2>
    </div>
