<ng-template #viewDescModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title" id="verticalCenteredModalLabel">Update Case Status (Ticket: {{ticketNumbers}})</h5>
        <button type="button" class="btn-close" (click)="modal.dismiss('Cross click')"></button>
    </div>
    <div class="modal-body">
        <form>
            <div class="mb-3">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Status</mat-label>
                    <mat-select [(ngModel)]="sgrcStatus" name="status" [disabled]="isInputDisabled">
                        <mat-option value="O">Open</mat-option>
                        <mat-option value="C">Closed</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="mb-3">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Remarks</mat-label>
                    <textarea matInput [(ngModel)]="sgrcRemarks" name="remarks" rows="3" [disabled]="isInputDisabled"></textarea>
                </mat-form-field>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" mat-flat-button color="warn" (click)="modal.dismiss('Close click')">Close</button>
        <button type="button" mat-flat-button color="primary" (click)="VerifyData()" [disabled]="isInputDisabled">
            <span *ngIf="!isInputDisabled">Submit</span>
            <mat-spinner [diameter]="20" *ngIf="isInputDisabled"></mat-spinner>
        </button>
    </div>
</ng-template>
