  <div class="row">
    <div class="col-md-12 grid-margin">
      <div class="card">
        <div class="card-body">
          <h6 class="card-title">Journal Forms</h6>

          <aw-wizard #wizardForm>
            <aw-wizard-step stepTitle="Journal Basic Information">
              <form (ngSubmit)="form1Submit()" [formGroup]="validationForm1" style="margin-top: 20px;">
                <div class="row">
                  <div class="col-md-6">

                      <div class="col-sm-9">
                        <input id="journalTitle" formControlName="journalTitle" class="form-control" placeholder="Journal Title"
                          [ngClass]="{'is-invalid': isForm1Submitted && form1.journalTitle.errors}">
                        <div *ngIf="isForm1Submitted && form1.journalTitle.errors?.required" class="invalid-feedback">
                          Required
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="row mb-3">
                      <label for="lastName" class="col-sm-3 col-form-label">Journal Sub Title</label>
                      <div class="col-sm-9">
                        <input id="subTitle" formControlName="subTitle" class="form-control" placeholder="Journal Sub Title"
                          [ngClass]="{'is-invalid': isForm1Submitted && form1.subTitle.errors}">
                        <div *ngIf="isForm1Submitted && form1.subTitle.errors?.required" class="invalid-feedback">
                          Required
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="row mb-3">
                      <label for="lastName" class="col-sm-3 col-form-label">Journal Volume</label>
                      <div class="col-sm-9">
                        <input id="Volume" formControlName="Volume" class="form-control" placeholder="Journal Volume"
                          [ngClass]="{'is-invalid': isForm1Submitted && form1.Volume.errors}">
                        <div *ngIf="isForm1Submitted && form1.Volume.errors?.required" class="invalid-feedback">
                          Required
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="row mb-3">
                      <label for="lastName" class="col-sm-3 col-form-label">Journal Publish Date:</label>
                      <div class="col-sm-9">
                        <input id="publishDate" type="date" formControlName="publishDate" class="form-control"
                          [ngClass]="{'is-invalid': isForm1Submitted && form1.publishDate.errors}" placeholder="Journal Publish Date">
                        <div *ngIf="isForm1Submitted && form1.publishDate.errors?.required" class="invalid-feedback">
                          Required
                        </div>
                      </div>
                    </div>
                  </div>

                  <button class="btn btn-primary" type="submit">Continue</button>
                </div>
              </form>
            </aw-wizard-step>
            <aw-wizard-step stepTitle="Journal Basic Property Details">

  </div>
  <!-- Wizard Controls -->
  <div class="wizard-controls">
    <button (click)="previousStep()" [disabled]="currentStep === 1">Previous</button>
    <button (click)="nextStep()" *ngIf="currentStep < 3">Next</button>
    <button (click)="saveJournal()" *ngIf="currentStep === 3">Save Journal</button>
  </div>

<div *ngIf="!filteredJournal && selectedJournalId">
  <p>No journal found with ID: {{ selectedJournalId }}</p>
</div>
