
<div class="h-100 d-flex p-2 align-items-center justify-content-center">
  <div class="container ">
    <div class="row">
      <div class="col-md-12 grid-margin stretch-card">
        <div class="card">
          <div class="card-body">
            <!-- <h6 class="card-title" style="text-align: center">Placement</h6> -->
            <div class="row d-flex justify-content-center">
              <div class="col-sm-3">
                <div class="form-group">
                  <label for="fromDate">From Date</label>
                  <input type="date" class="form-control" bsDatepicker [(ngModel)]="fromDate" name="fromdate">
                </div>
              </div>
              <div class="col-sm-3">
                <div class="form-group">
                  <label for="toDate">To Date</label>
                  <input type="date" class="form-control" bsDatepicker [(ngModel)]="toDate" name="todate">
                </div>
              </div>
              <div class="col-sm-3 d-flex justify-content-center align-items-center">
                <div class="form-group">
                  <label for="action" class="mb-3"></label>
                  <button type="button" class="btn btn-warning mt-3" style="color: #fff; background-color: #f68220;"
                    (click)="showData()">Get Details</button>
                </div>
              </div>
              <div class="col-sm-3 d-flex align-items-center">
                <div class="form-group">
                  <label for="action" class="mb-2"></label>
                  <button type="reset" style="margin-right: 3rem; float:left" class="btn btn-dark btn-warning mt-3"
                    (click)="ResetData()">Reset Form</button>
                </div>
              </div>
            </div>
            <div class="row m-4">
              <div class="col-sm-12 text-center">
                <button type="button" style="margin-right: 1rem;" class="btn btn-dark btn-outline-warning mb-12"
                  (click)="exportExcel()" *ngIf="rmsData?.length > 0" [disabled]="rmsData?.length===0">Export to
                  Excel</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="isLoading" class="spinner-container">
      <div class="col-sm-12" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
        <div class="d-flex justify-content-center align-item-center">
          <!-- <span class="text-dark fs-3">Loading </span><br /> -->
          <div class="spinner-grow text-dark tex-center" style=" width: 18rem; height: 18rem;" role="status">
          </div>
        </div>
      </div>
    </div>

    <div class="row" *ngIf="!isLoading && rmsData?.length > 0; else NoRecords">
      <div class="col-md-12 stretch-card">
        <div class="card">
          <div class="card-body" *ngIf="dataShowing===true;">
            <h6 class="card-title">Data Table RMS DSR Remarks </h6>
            <div class="table-responsive">
              <div id="wrapper1">
                <div id="div1">
                </div>
              </div>
              <div id="wrapper2">
                <div id="div2">
                  <table id="dataTableExampleNews" class="table table-responsive table-full-width">
                    <thead>
                      <tr>
                        <th *ngFor="let dt of rmsDataColumns; let i = index">
                          {{dt}}
                        </th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let row of rmsData; let rowIndex = index">
                        <td *ngFor="let col of rmsDataColumns; let colIndex = index">
                          <ng-container *ngIf="colIndex <2; else buttonCell">
                            {{ row[col] }}   
                          </ng-container>
                          <ng-template #buttonCell>
                            <button type="button" class="btn btn-warning btn-outline-dark mb-12"
                              (click)="getData(getResponse(colIndex),colIndex, row['dsrRatingDO'])">
                              {{ row[col] }} 
                            </button>
                          </ng-template>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
         
        </div>
      </div>
    </div>
    <ng-template #NoRecords>
      <div class="themeClr">
        <h1 class="fs-2 text-center vh-50 p-3 m-4 "> No Data Found </h1>
      </div>
    </ng-template>
   
  </div>

  <ng-template #viewDescModal2 let-modal>
    <div class="modal-header">
      <h5 class="modal-title ms-4 themeClr" id="exampleModalLabel">RMD DSR Rating Data Details </h5>
      <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <div class="col-md-12 grid-margin stretch-card">
        <div class="card">
          <div class="row">
            <div class="row m-4 d-flex justify-content-center">
              <!-- <div class="col-sm-6 text-start">
                <span class="themeClr  fs-2 "> Record Count {{rmsDataRMSDSRRatingDataDetails?.length}}</span>
              </div> -->
              <div class="col-sm-12 ">
                <button type="button" style="margin-right: 1rem;" class="btn btn-dark btn-outline-warning mb-12"
                  (click)="exportExcelRatingGrid()" *ngIf="rmsDataRMSDSRRatingDataDetails?.length > 0" [disabled]="rmsDataRMSDSRRatingDataDetails?.length===0">Export to
                  Excel</button>
              </div>
            </div>
          </div>
          <div class="card-body" *ngIf="rmsDataRMSDSRRatingDataDetails?.length>0; else NoDataFound ">
            <div class="table-responsive">
              <div id="wrapper11">
                <div id="div1">
                 
                </div>
              </div>
              <div id="wrapper21">
                <div id="div2">
                  <table id="dataTableExampleDataDSRRating" class="table table-responsive table-full-width">
                    <thead>
                      <tr>
                        <th *ngFor="let dt of rmsDataColumnsRMSDSRRatingDataDetails">{{dt}}</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let row of rmsDataRMSDSRRatingDataDetails">
                        <td *ngFor="let col of rmsDataColumnsRMSDSRRatingDataDetails">
                          {{ row[col] }}
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
          <ng-template #NoDataFound>
            <div class="themeClr">
              <h1 class="fs-2 text-center vh-50 p-3 m-4 "> No Data Found </h1>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </ng-template>
