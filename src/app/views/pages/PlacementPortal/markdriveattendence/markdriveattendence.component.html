<app-menu-bar></app-menu-bar>
<div class="label container-fluid">
    <h4> Mark Attendance For Placement Drive</h4>
</div>
<div class="box container-fluid">
    <form [formGroup]="placementForm" (ngSubmit)="OnSubmit()">
        <br/>
        <div class="row">
            <div class="col-sm-2 text-center ms-5 mt-2">
                <label class="form-label fs-5">Select Drive:</label>
            </div>
            <div class="col-sm-10 w-50 text-center ms-5  mt-2">
                <select class="form-select fs-5" formControlName="DriveDropDown" aria-label="Default select example" (change)="GetDriveCode($event)">
                    <!-- <option value="Select"> select </option> -->
                    <option [value]="ListData.driveId" *ngFor="let ListData of DriveDropDown">{{ListData.driveCode}}</option>
                </select>
            </div>
        </div>
        <br/>
        <div class="row">
            <div class="col-sm-2 text-center ms-5  mt-2">
                <label class="form-label fs-5">Select Round:</label>
            </div>
            <div class="col-sm-10 w-50 text-center ms-5 mt-2">
                <select class="form-select fs-5" formControlName="RoundDetails" aria-label="Default select example">
                    <option [value]="ListDriveCode.parameterId" *ngFor="let ListDriveCode of RoundDetails"> {{ListDriveCode.parameterName}} </option>
                    <!-- <option value="One">One</option>
                    <option value="Two">Two</option>
                    <option value="Three">Three</option>
                    <option value="Four">Four</option> -->
                </select>
            </div>
        </div>
        <div class="row">
            <div class="details ms-5 mt-2">
            <input class="form-check-input ms-5 mt-2" type="checkbox" value="Mark Manual Attendance for this Round" id="mannualMark" formControlName="mannualMark"
              name="mannualMark">
            <label class="ms-3 w-100 fs-5" for="mannualMark">
                Mark Manual Attendance for this Round
            </label>
          </div>
        </div>
        <div class="btt mt-2">
            <button type="submit" class="btn"  [disabled]="placementForm.get('selectedDrive')?.value === 'Select' || placementForm.get('selectedRound')?.value === 'Select'">Submit</button>
        </div>
    </form>
</div>
