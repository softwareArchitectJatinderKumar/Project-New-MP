<mat-table [dataSource]="dataSource" matSort    class="mat-elevation-z8">
    <ng-container [matColumnDef]="column" *ngFor="let column of displayedColumns">
      <mat-header-cell *matHeaderCellDef>
        <ng-container *ngIf="column !== 'action'">{{ column | titlecase }}</ng-container>
        <ng-container *ngIf="column === 'action'">Actions</ng-container>
      </mat-header-cell>
      <mat-cell *matCellDef="let contact" [ngSwitch]="column">
        <ng-container *ngSwitchDefault>{{ contact[column] }}</ng-container>
        <ng-container *ngSwitchCase="'action'">
          <button mat-button class="update-button"(click)="performAction(contact)">Update</button>
        </ng-container>
      </mat-cell>
    </ng-container>
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>


  </mat-table>
  <mat-paginator [pageSizeOptions]="[ 10, 20,  40,50, 100]" [pageSize]="10"></mat-paginator>
