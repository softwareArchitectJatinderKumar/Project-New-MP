<div class="h-100 d-flex p-2 align-items-center justify-content-center" id="RMSReportss" *ngIf="isLoginFailed==false; else loginFailed">
  <div class="container-fluid ">
    <div class="row">
      <div class="col-md-12 grid-margin stretch-card">
        <div class="card">
          <div class="card-body">
            <div class="row">
              <div class="col-sm-3">
                <div class="form-group">
                  <label for="fromDate">From Date</label>
                  <input type="date" class="form-control" bsDatepicker [(ngModel)]="fromDate" name="fromdate">
                </div>
              </div>
              <div class="col-sm-4">
                <div class="form-group">
                  <label for="toDate">To Date</label>
                  <input type="date" class="form-control" bsDatepicker [(ngModel)]="toDate" name="todate">
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-10 text-center">
                <button type="button" class="btn btn-warning" style="color: #fff; background-color: #f68220;" [disabled]="toDate.length<=1 || fromDate.length<=1"
                  (click)="showData()">Show</button>
                <button type="reset" style="float: right; margin-right: 10px; " (click)="resetForm()" [disabled]="toDate.length<=1 || fromDate.length<=1"
                  class="btn btn-warning mb-12">Reset</button>
                <button type="button" style="float: right; margin-right: 10px; color: #fff; background-color: #f68220;" class="btn btn-outline-warning mb-12" [disabled]="toDate.length<=1 || fromDate.length<=1"
                  (click)="exportExcel()">Export to Excel</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row" *ngIf="!isLoading; else Loader">
      <div class="col-md-12 stretch-card">
        <div class="card">
          <div class="card-body" *ngIf="dataShowing">
            <h6 class="card-title">Data Table</h6>
            <div class="table-responsive">
              <div id="wrapper1">
                <div id="div1">
                </div>
              </div>
              <div id="wrapper2">
                <div id="div2">
                  <table id="dataTableExampleNews" class="table table-responsive table-full-width">
                    <thead>
                      <tr>
                        <th *ngFor="let dt of rmsDataColumns">{{dt}}</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let row of rmsData">
                        <td *ngFor="let col of rmsDataColumns">
                          {{ row[col] }}
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>


    </div>
    <div class="container accordionColor ">
      <ng-template #Loader>
        <div class="row blockHeight">
          <div class="text-center">
            <!-- <h4 class="text-center fs-3 text-danger"> Loading Data.. </h4> -->
            <span class="text-danger fs-3">Loading </span><br />
            <div class="spinner-grow text-danger text-center" style=" width: 14rem; height: 14rem;" role="status">
            </div>
          </div>
        </div>
      </ng-template>
    </div>
  </div>
</div>
<ng-template #loginFailed>
  <div class="text-center bg-info" *ngIf="isLoginFailed">
    <h3 class="text-center fs-2 m-5 text-danger pt-5 "> Error in User Login . </h3>
    <div class="row mt-4 mb-4">
      <div class="col-sm-12 text-center">
        <div class="mb-3 p-4">
          <Label class="form-label fs-4 text-danger ">Unauthorise Access.</Label>
        </div>
      </div>
    </div>
  </div>
</ng-template>
