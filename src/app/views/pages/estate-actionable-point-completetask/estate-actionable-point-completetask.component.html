<div class="container-fluid px-2">
  <div class="row">
    <div class="col-12">
      <div class="table-responsive">
     <table class="table table-bordered table-sm">
  <thead class="table-light">
    <tr>
      <th>Id</th>
      <th>Task Description</th>
      <th>Inspection Type</th>
      <th>Remarks</th>
      <th>Start Date</th>
      <th>End Date</th>
      <th>Status</th>
      <th>Upload Proof</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let task of ConstructionDetails; let i = index" [ngClass]="{ 'table-success': task.status === 'Completed' }"
    >
      <td>{{ i + 1 }}</td>
      <td>{{ task.taskDescription }}</td>
      <td>{{ task.inspectionType }}</td>

      <!-- Remarks -->
      <td>
        <textarea
          class="form-control form-control-sm w-100"
          rows="2"
          placeholder="Remarks"
          style="min-width: 200px;"
          [(ngModel)]="task.remarks"
          [disabled]="task.status === 'Completed'">
        </textarea>
      </td>

      <!-- Start Date -->
      <td>
        <input
          type="date"
          class="form-control form-control-sm"
          style="max-width: 120px;"
          [(ngModel)]="task.startDate"
          [disabled]="task.startDate !== '' && task.status === 'Completed'">
          
      </td>

      <!-- End Date -->
      <td>
        <input
          type="date"
          class="form-control form-control-sm"
          style="max-width: 120px;"
          [(ngModel)]="task.endDate"
          [disabled]="task.endDate !== '' && task.status === 'Completed'">
      </td>

      <!-- Status -->
      <td>
        <select
          class="form-select form-select-sm"
          [(ngModel)]="task.status"
          name="status"
          [disabled]="task.status === 'Completed'">
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
      </td>

      <!-- File Upload -->
      <td>
  <div class="d-flex align-items-center gap-2">
    <input
      type="file"
      class="form-control form-control-sm"
      (change)="onFileSelected($event, i)"
      style="max-width: 150px;"
     
    >

    <!-- Download icon button -->
    <button
      *ngIf="task.proofImageURL"
      class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center"
      (click)="downloadImage(task.proofImageURL)" 
      matTooltip="Download Image"
      [disabled]="task.status !== 'Completed'"
      style="height: 30px; width: 30px; padding: 0;"
    >
      <mat-icon fontIcon="file_download" style="font-size: 18px;"></mat-icon>
    </button>
  </div>
</td>

      <td>
        <button
          class="btn btn-sm btn-primary"
          (click)="onSubmitTable(i)"
          
          >
          Submit
        </button>
      </td>
    </tr>
  </tbody>
</table>

      </div>
    </div>
  </div>
</div>
