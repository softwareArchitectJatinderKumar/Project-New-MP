
<div class="container mt-5" style="    margin-top: 0% !important;">

    <div class="row">
<h2 style="text-align: center;">MOU Dashboard</h2>
<hr>
<ng-container *ngFor="let rowAtt of moudata;let index=index;">
    <div class="col-lg-3 col-md-4 mb-2 pe-1 ps-1">
        <a href="javascript:void(0)" class="card {{rowAtt.img}} card-back">
          <div class="card-body-hover card-body-color-1">
            <span class="goal-number">{{index+1}}</span>
            <h3 class="goal-title">{{rowAtt.areaDescription}}</h3>
            <p class="goal-text"></p>
            <div class="goal-info">
              <div class="col-6">
                <span class="number">{{rowAtt.target}}</span>
                <p class="feature">Total Metric</p>
              </div>
              <div class="col-6">
                <span class="number">{{rowAtt.mouAchieved}}</span>
                <p class="feature">
                  Mou Uploaded</p>
              </div>
              <div class="col-6">
                <span class="number">{{rowAtt.totalPlannedActivity}}</span>
                <p class="feature">Planned Activity</p>
              </div>
              <div class="col-6">
                <span class="number">{{rowAtt.completedActivity}}</span>
                <p class="feature">Activity Completed</p>
              </div>
            </div>
            <button type="button" class="btn btn-goal">More info</button>
          </div>


          <div class="card-body {{rowAtt.color}}">
            <div class="card-body-info">
              <h3>{{index+1}}</h3>
              <span>{{rowAtt.areaDescription}}</span>
            </div>
            <div class="card-body-icon text-center">
              <img [src]="rowAtt.imgIcon" />
            </div>
          </div>
        </a>
      </div>

</ng-container>
