<div class="sticky-bar" id="stickBar" style="cursor: pointer;" >
    <ul>
      
        <li class="liNew" id="liNews">
            <div class="li-header" 
  >
            <a  href="javascript:void(0)" (click)="callfxn()" >
                <span class="st-label">Share your Feedback</span>
<img width="auto" height="auto" src="https://www.lpu.in/images/feedback-icon.png" alt="feedback-icon">
            </a>
            <a href="javascript:void(0)" (click)="closeData()" class="close-btn-feed"><i data-feather="x-circle"></i></a>
        </div>
            <div class="feed-back-form" id="fdNew" style="margin-left:10px;">
            <br/>
                <ul class="feedback" id="fBack">
                    <li class="angry" (click)="ratingData(1);">
                        <div>
                            <svg class="eye left">
                                <use xlink:href="#eye"/>
                            </svg>
                            <svg class="eye right">
                                <use xlink:href="#eye"/>
                            </svg>
                            <svg class="mouth">
                                <use xlink:href="#mouth"/>
                            </svg>
                        </div>
                    </li>
                    <li class="sad" (click)="ratingData(2);">
                        <div>
                            <svg class="eye left">
                                <use xlink:href="#eye"/>
                            </svg>
                            <svg class="eye right">
                                <use xlink:href="#eye"/>
                            </svg>
                            <svg class="mouth">
                                <use xlink:href="#mouth"/>
                            </svg>
                        </div>
                    </li>
                    <li class="ok" (click)="ratingData(3);">
                        <div></div>
                    </li>
                    <li class="good" (click)="ratingData(4);">
                        <div>
                            <svg class="eye left">
                                <use xlink:href="#eye"/>
                            </svg>
                            <svg class="eye right">
                                <use xlink:href="#eye"/>
                            </svg>
                            <svg class="mouth">
                                <use xlink:href="#mouth"/>
                            </svg>
                        </div>
                    </li>
                    <li class="happy active" (click)="ratingData(5);">
                        <div>
                            <svg class="eye left">
                                <use xlink:href="#eye"/>
                            </svg>
                            <svg class="eye right">
                                <use xlink:href="#eye"/>
                            </svg>
                        </div>
                    </li>
                </ul>
                <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
                    <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7 4" id="eye">
                        <path d="M1,1 C1.83333333,2.16666667 2.66666667,2.75 3.5,2.75 C4.33333333,2.75 5.16666667,2.16666667 6,1"></path>
                    </symbol>
                    <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 7" id="mouth">
                        <path d="M1,5.5 C3.66666667,2.5 6.33333333,1 9,1 C11.6666667,1 14.3333333,2.5 17,5.5"></path>
                    </symbol>
                </svg> 
              <br/>
                <!-- <textarea class="form-control" id="txtFeedback" [(ngModel)]="areaFeedback" rows="4" placeholder="Feedback"></textarea> -->
                <input type="button" name="" (click)="addFeedback();" style="margin-bottom: 10px;
                margin-left: 14px;" value="Submit Feedback" class="btn btn-secondary mt-2">
             
              </div>
        </li>
    </ul>
</div>

<ng-template #basicModal let-modal style="max-width: 100% !important;">
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">Details</h5>
      <button type="button" class="btn-close" (click)="modal.close('by: close button')"  aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <table id="dataTableExampleNew"  class="table table-striped" >
            <thead>
                <tr >
                    <ng-container *ngFor="let item of linkedheadHtmlData | keyvalue">
                        <th>{{item.key}}</th>
                    </ng-container>
                  
                  
                </tr>
            </thead>
            <tbody>
                <ng-container *ngFor="let row of linkedHtmlData; let index=index; let even=even">
                    <tr class="tid-data-row tid-even" >
                        <ng-container *ngFor="let item of row | keyvalue;let index1=index; let even1=even">
                            <!-- <td><span [innerHTML]="getExactValue(item.value)"></span></td> -->
                            <ng-container *ngIf="checkhttplink(item.value)">
                          <td> <span>    
                            <a [href]="item.value" target="_blank" class="btn btn-secondary" >View Data</a>
                            <!-- <button type="button" (click)="viewData(item.value)" class="btn btn-secondary" >View Data</button></span></td> -->
                        </span></td>
                            </ng-container>
                            <ng-container *ngIf="!checkhttplink(item.value)">
                                <td >{{item.value}}</td>
                            </ng-container>
                            
                            </ng-container>
                          
                    </tr>
               
                </ng-container>
            </tbody>

        </table>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="modal.close('by: close button')">Close</button>
    </div>
  </ng-template>
