 <div class="card shadow-lg p-3">
    
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="text-primary m-0">{{ componentTitle }}</h3>
        
        <button mat-raised-button color="primary" (click)="exportToExcel()">
            <mat-icon>file_download</mat-icon>
            Export to Excel
        </button>
    </div>

    <div class="row mb-3 align-items-center">
        <div class="col-md-4">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Search</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Filter data..." [(ngModel)]="searchText">
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
        </div>
        <div class="col-md-8"></div>
    </div>

    <div class="mat-elevation-z2 table-responsive">
        <table mat-table [dataSource]="dataSource" class="w-100">

            <ng-container *ngFor="let col of columns" [matColumnDef]="col.field">
                <th mat-header-cell *matHeaderCellDef class="bgColorStyle p-2 "> 
                    {{ col.header }} 
                </th>
                <td mat-cell *matCellDef="let element" class="p-4 m-2"> 
                    {{ element[col.field] }} 
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="columns.length">
                    No records matching the filter "{{searchText}}"
                </td>
            </tr>
        </table>
    </div>

    <mat-paginator 
        [pageSizeOptions]="pageSizeOptions" 
        showFirstLastButtons 
        aria-label="Select page of data records">
    </mat-paginator>

</div>
